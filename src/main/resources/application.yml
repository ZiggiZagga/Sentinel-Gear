ironbucket:
spring:
server:
  port: 8080

    oauth2:
  application:
    name: edge-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: world-route
          uri: lb://world-service
          predicates:
            - Path=/world/
        - id: greeting-route
          uri: lb://greeting-service
          predicates:
            - Path=/greet/
        - id: graphql-route
          uri: lb://graphql-service
          predicates:
            - Path=/graphql/
            - Method=POST
          filters:
            - RewritePath=/graphql/(?<remaining>.*), /${remaining}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh,bus-refresh
      client:
        registration:
          gateway-service:
            client-id: sentinel-gear-app
            client-secret: sentinel-gear-app-secret
            scope:
              - openid
            authorization-grant-type: authorization_code
          test-client:
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/test-client
            scope: openid,profile,email
        provider:
          gateway-service:
            issuer-uri: ${IDP_PROVIDER_PROTOCOL}://${IDP_PROVIDER_HOST}/realms/${IDP_PROVIDER_REALM}
            authorization-uri: ${IDP_PROVIDER_PROTOCOL}://${IDP_PROVIDER_HOST}/realms/${IDP_PROVIDER_REALM}/protocol/openid-connect/auth
            token-uri: ${IDP_PROVIDER_PROTOCOL}://${IDP_PROVIDER_HOST}/realms/${IDP_PROVIDER_REALM}/protocol/openid-connect/token
            user-info-uri: ${IDP_PROVIDER_PROTOCOL}://${IDP_PROVIDER_HOST}/realms/${IDP_PROVIDER_REALM}/protocol/openid-connect/userinfo
            jwk-set-uri: ${IDP_PROVIDER_PROTOCOL}://${IDP_PROVIDER_HOST}/realms/${IDP_PROVIDER_REALM}/protocol/openid-connect/certs
          test-client:
            issuer-uri: http://localhost:9999/realms/test
  docker:
    compose:
      file:
        - ${DOCKER_FILES_HOMEDIR}/docker-compose-steel-hammer.yml
      enabled: false
